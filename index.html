<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCodeTech | Live Bot Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <h1>⚡ Algorithmic Trading Operations</h1>
  <p id="connection-status">🟡 Connecting to Samsung A12 Server...</p>
</header>

<main>

  <!-- Bot V6 Dashboard Card -->
  <div class="card bot-card">
    <div class="card-header">
      <h2>🤖 4hourbotV6U</h2>
      <span id="v6-badge" class="badge">Checking...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="label">Balance</span>
        <span class="val" id="v6-balance">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">Open PnL</span>
        <span class="val" id="v6-open-pnl">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">Realized PnL</span>
        <span class="val" id="v6-realized-pnl">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">Win Rate</span>
        <span class="val" id="v6-winrate">0.0%</span>
      </div>
    </div>

    <!-- Live PnL Graph -->
    <div class="chart-container">
      <canvas id="v6Chart"></canvas>
    </div>

    <!-- Active Positions -->
    <h3 style="margin-top: 15px;">Active Positions</h3>
    <div id="v6-trades" class="trade-list">
      <p style="color: #bbb;">No active positions.</p>
    </div>
  </div>

</main>

<footer>
  <p>© 2026 TCodeTech • Auto-refreshing every 3s</p>
</footer>

<script>
  // Replace this with your active Cloudflare Tunnel URL
  const API_URL = "https://customize-knowing-productions-naturally.trycloudflare.com/api/bots_summary";

  let chartInstance = null;

  function initChart() {
    const ctx = document.getElementById('v6Chart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels: Array(20).fill(''),
        datasets: [{
          label: 'Rolling Open PnL ($)',
          data: Array(20).fill(0),
          borderColor: '#38ef7d',
          backgroundColor: 'rgba(56, 239, 125, 0.1)',
          borderWidth: 2,
          tension: 0.3,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#ccc' } }
        }
      }
    });
  }

  async function fetchBotData() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      
      document.getElementById('connection-status').textContent = '🟢 Server Online • Telemetry Active';
      document.getElementById('connection-status').style.color = '#38ef7d';

      if (data.v6 && !data.v6.error) {
        const v6 = data.v6;
        document.getElementById('v6-badge').textContent = 'RUNNING';
        document.getElementById('v6-badge').className = 'badge badge-green';
        document.getElementById('v6-balance').textContent = `$${v6.balance.toFixed(2)}`;
        
        const openPnlEl = document.getElementById('v6-open-pnl');
        openPnlEl.textContent = `${v6.open_pnl >= 0 ? '+' : ''}$${v6.open_pnl.toFixed(2)}`;
        openPnlEl.style.color = v6.open_pnl >= 0 ? '#38ef7d' : '#ff4e50';

        document.getElementById('v6-realized-pnl').textContent = `$${v6.stats.realized_pnl.toFixed(2)}`;
        document.getElementById('v6-winrate').textContent = `${v6.stats.win_rate}% (${v6.stats.wins}W / ${v6.stats.losses}L)`;

        // Update Chart
        if (v6.pnl_history && chartInstance) {
          chartInstance.data.datasets[0].data = v6.pnl_history;
          chartInstance.data.datasets[0].borderColor = v6.open_pnl >= 0 ? '#38ef7d' : '#ff4e50';
          chartInstance.update();
        }

        // Render Positions
        const tradesContainer = document.getElementById('v6-trades');
        if (v6.trades && v6.trades.length > 0) {
          tradesContainer.innerHTML = v6.trades.map(t => `
            <div class="trade-row">
              <div>
                <strong>${t.symbol}</strong> <small>(${t.state})</small><br>
                <small style="color: #bbb;">TP: ${t.tp_pct}% | SL: ${t.sl_pct}%</small>
              </div>
              <div style="font-weight: bold; color: ${t.pnl >= 0 ? '#38ef7d' : '#ff4e50'}">
                ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}
              </div>
            </div>
          `).join('');
        } else {
          tradesContainer.innerHTML = '<p style="color: #aaa;">Scanning 15m entries (No active positions)...</p>';
        }
      } else {
        document.getElementById('v6-badge').textContent = 'OFFLINE';
        document.getElementById('v6-badge').className = 'badge badge-red';
      }
    } catch (e) {
      document.getElementById('connection-status').textContent = '🔴 Disconnected from A12 Server';
      document.getElementById('connection-status').style.color = '#ff4e50';
    }
  }

  window.onload = () => {
    initChart();
    fetchBotData();
    setInterval(fetchBotData, 3000);
  };
</script>
</body>
</html>
