<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCodeTech | Live Bot Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⚡ Algorithmic Trading Operations</h1>
  <p id="connection-status">🟡 Resolving active Cloudflare URL...</p>
</header>

<main id="bots-container">
  <p style="color: #8b949e;">Detecting active bots...</p>
</main>

<footer>
  <p>© 2026 TCodeTech • Auto-refreshing every 3s</p>
</footer>

<script>
  const TUNNEL_CONFIG_URL = "https://raw.githubusercontent.com/tcodetech/tcodetech.github.io/main/current_tunnel.json";
  let activeApiUrl = null;

  async function resolveActiveTunnelUrl() {
    try {
      const res = await fetch(TUNNEL_CONFIG_URL + "?nocache=" + new Date().getTime());
      if (res.ok) {
        const config = await res.json();
        if (config && config.url) {
          activeApiUrl = config.url.replace(/\/+$/, '') + "/api/bots_summary";
          document.getElementById('connection-status').textContent = '🟡 Connecting to ' + config.url.replace('https://', '') + '...';
          return true;
        }
      }
    } catch (e) {
      console.warn("Resolving tunnel URL...", e);
    }
    return false;
  }

  async function fetchBotData() {
    if (!activeApiUrl) {
      const resolved = await resolveActiveTunnelUrl();
      if (!resolved) {
        document.getElementById('connection-status').textContent = '🔴 Awaiting Live Tunnel Sync from Termux...';
        document.getElementById('connection-status').style.color = '#ff4e50';
        return;
      }
    }

    try {
      const res = await fetch(activeApiUrl);
      const data = await res.json();
      
      document.getElementById('connection-status').textContent = '🟢 Server Online • Telemetry Active';
      document.getElementById('connection-status').style.color = '#38ef7d';

      const container = document.getElementById('bots-container');

      if (data.bots && data.bots.length > 0) {
        container.innerHTML = data.bots.map(bot => {
          const isRunning = bot.is_running === true;
          const badgeClass = isRunning ? 'badge-green' : 'badge-red';
          const badgeText = isRunning ? 'RUNNING' : 'OFFLINE';
          const openPnl = bot.open_pnl || 0;
          const pnlColor = openPnl >= 0 ? '#38ef7d' : '#ff4e50';
          const pnlSign = openPnl >= 0 ? '+' : '';

          const tradesHtml = (bot.trades && bot.trades.length > 0) 
            ? bot.trades.map(t => `
                <div class="trade-row">
                  <div>
                    <strong>${t.symbol}</strong> <small>(${t.state || 'OPEN'})</small><br>
                    <small style="color: #bbb;">TP: ${t.tp_pct || 0}% | SL: ${t.sl_pct || 0}%</small>
                  </div>
                  <div style="font-weight: bold; color: ${t.pnl >= 0 ? '#38ef7d' : '#ff4e50'}">
                    ${t.pnl >= 0 ? '+' : ''}$${(t.pnl || 0).toFixed(2)}
                  </div>
                </div>
              `).join('')
            : '<p style="color: #aaa; margin: 5px 0;">No active positions.</p>';

          return `
            <div class="card bot-card" style="margin-bottom: 20px;">
              <div class="card-header">
                <h2>🤖 ${bot.name}</h2>
                <span class="badge ${badgeClass}">${badgeText}</span>
              </div>

              <div class="stats-grid">
                <div class="stat-box">
                  <span class="label">Balance</span>
                  <span class="val">$${(bot.balance || 0).toFixed(2)}</span>
                </div>
                <div class="stat-box">
                  <span class="label">Open PnL</span>
                  <span class="val" style="color: ${pnlColor}">${pnlSign}$${openPnl.toFixed(2)}</span>
                </div>
                <div class="stat-box">
                  <span class="label">Realized PnL</span>
                  <span class="val">$${(bot.stats?.realized_pnl || 0).toFixed(2)}</span>
                </div>
                <div class="stat-box">
                  <span class="label">Win Rate</span>
                  <span class="val">${bot.stats?.win_rate || 0}% (${bot.stats?.wins || 0}W / ${bot.stats?.losses || 0}L)</span>
                </div>
              </div>

              <h3 style="margin-top: 15px;">Active Positions</h3>
              <div class="trade-list">
                ${tradesHtml}
              </div>
            </div>
          `;
        }).join('');
      } else {
        container.innerHTML = '<p style="color: #8b949e;">No bot folders found in ~/bot/bots/.</p>';
      }

    } catch (e) {
      activeApiUrl = null;
      document.getElementById('connection-status').textContent = '🔴 Tunnel Reconnecting...';
      document.getElementById('connection-status').style.color = '#ff4e50';
    }
  }

  window.onload = async () => {
    await resolveActiveTunnelUrl();
    fetchBotData();
    setInterval(fetchBotData, 3000);
  };
</script>
</body>
</html>
