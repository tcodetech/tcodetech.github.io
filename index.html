<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCodeTech | Live Bot Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: monospace, -apple-system, sans-serif;
      padding: 16px;
    }

    .main-header {
      margin-bottom: 24px;
    }

    .main-title {
      font-size: 22px;
      font-weight: bold;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .telemetry-status {
      font-size: 13px;
      color: #e3b341;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .bot-name {
      font-size: 20px;
      font-weight: bold;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge-running {
      color: #38ef7d;
      background: rgba(56, 239, 125, 0.1);
      border: 1px solid #38ef7d;
    }

    .badge-offline {
      color: #ff4e50;
      background: rgba(255, 78, 80, 0.1);
      border: 1px solid #ff4e50;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 14px;
    }

    .stat-box .label {
      font-size: 11px;
      color: #8b949e;
      display: block;
      margin-bottom: 6px;
    }

    .stat-box .val {
      font-size: 18px;
      font-weight: bold;
      color: #f0f6fc;
      display: block;
    }

    .chart-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 12px;
      height: 180px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .trade-list {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
    }

    .trade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
    }

    .trade-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="main-header">
      <div class="main-title">
        <span>⚡</span> Algorithmic Trading Operations
      </div>
      <div id="connection-status" class="telemetry-status">
        🟡 Connecting to telemetry stream...
      </div>
    </div>

    <div class="card-header">
      <div class="bot-name">
        <span>🤖</span> 4hourbotV6U
      </div>
      <span id="v6-badge" class="badge badge-offline">CONNECTING...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="label">Balance</span>
        <span class="val" id="v6-balance">--</span>
      </div>
      <div class="stat-box">
        <span class="label">Open PnL</span>
        <span class="val" id="v6-open-pnl">--</span>
      </div>
      <div class="stat-box">
        <span class="label">Realized PnL</span>
        <span class="val" id="v6-realized-pnl">--</span>
      </div>
      <div class="stat-box">
        <span class="label">Win Rate</span>
        <span class="val" id="v6-winrate">--</span>
      </div>
    </div>

    <div class="chart-box">
      <canvas id="v6Chart"></canvas>
    </div>

    <div class="section-title">Active Positions</div>
    <div id="v6-trades" class="trade-list">
      <p style="color: #8b949e;">Waiting for bot feed...</p>
    </div>
  </div>

<script>
  const TUNNEL_URL = "https://motherboard-cas-ventures-translate.trycloudflare.com";
  let chartInstance = null;

  function initChart() {
    try {
      const canvas = document.getElementById("v6Chart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: Array(20).fill(""),
          datasets: [{
            label: "PnL ($)",
            data: Array(20).fill(0),
            borderColor: "#38ef7d",
            backgroundColor: "rgba(56, 239, 125, 0.08)",
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: {
              grid: { color: "rgba(255,255,255,0.06)" },
              ticks: { color: "#8b949e", font: { size: 10 } }
            }
          }
        }
      });
    } catch(e) {
      console.error("Chart Error:", e);
    }
  }

  function applyData(data) {
    if (!data || !data.v6) return;
    const v6 = data.v6;
    const statusEl = document.getElementById("connection-status");
    const badgeEl = document.getElementById("v6-badge");

    statusEl.innerHTML = "🟢 Telemetry Active";
    statusEl.style.color = "#38ef7d";

    if (v6.is_running) {
      badgeEl.textContent = "RUNNING";
      badgeEl.className = "badge badge-running";
    } else {
      badgeEl.textContent = "STOPPED";
      badgeEl.className = "badge badge-offline";
    }

    if (v6.balance !== undefined) {
      document.getElementById("v6-balance").textContent = "$" + Number(v6.balance).toLocaleString("en-US", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    if (v6.open_pnl !== undefined) {
      const pnlEl = document.getElementById("v6-open-pnl");
      pnlEl.textContent = (v6.open_pnl >= 0 ? "+" : "") + "$" + Number(v6.open_pnl).toFixed(2);
      pnlEl.style.color = v6.open_pnl >= 0 ? "#38ef7d" : "#ff4e50";
    }

    if (v6.stats) {
      const realEl = document.getElementById("v6-realized-pnl");
      realEl.textContent = (v6.stats.realized_pnl >= 0 ? "+" : "") + "$" + Number(v6.stats.realized_pnl || 0).toFixed(2);
      realEl.style.color = (v6.stats.realized_pnl || 0) >= 0 ? "#38ef7d" : "#ff4e50";
      document.getElementById("v6-winrate").textContent = (v6.stats.win_rate || 0) + "% (" + (v6.stats.wins || 0) + "W / " + (v6.stats.losses || 0) + "L)";
    }

    if (v6.pnl_history && Array.isArray(v6.pnl_history) && chartInstance) {
      chartInstance.data.datasets[0].data = v6.pnl_history;
      chartInstance.data.datasets[0].borderColor = (v6.open_pnl >= 0) ? "#38ef7d" : "#ff4e50";
      chartInstance.update();
    }

    const container = document.getElementById("v6-trades");
    if (v6.trades && Array.isArray(v6.trades) && v6.trades.length > 0) {
      container.innerHTML = "";
      v6.trades.forEach(t => {
        const row = document.createElement("div");
        row.className = "trade-item";
        row.innerHTML = `
          <div>
            <strong style="color:#f0f6fc;">${t.symbol}</strong> 
            <span style="color:#8b949e; font-size:11px;">(${t.state || "ACTIVE"})</span>
            <br>
            <span style="color:#6e7681; font-size:11px;">TP: ${t.tp_pct}% | SL: ${t.sl_pct}%</span>
          </div>
          <div style="font-weight:bold; color:${t.pnl >= 0 ? '#38ef7d' : '#ff4e50'};">
            ${t.pnl >= 0 ? '+' : ''}$${Number(t.pnl).toFixed(2)}
          </div>
        `;
        container.appendChild(row);
      });
    } else {
      container.innerHTML = '<p style="color:#8b949e;">Scanning entries (No active positions)...</p>';
    }
  }

  async function fetchBotData() {
    const statusEl = document.getElementById("connection-status");
    const badgeEl = document.getElementById("v6-badge");

    try {
      const res = await fetch(`${TUNNEL_URL}/api/public/bot-data?t=${Date.now()}`, {
        method: "GET",
        cache: "no-store",
        headers: { "Accept": "application/json" }
      });

      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      applyData(data);
    } catch (err) {
      statusEl.innerHTML = "🔴 Telemetry Offline: " + err.message;
      statusEl.style.color = "#ff4e50";
      badgeEl.textContent = "DISCONNECTED";
      badgeEl.className = "badge badge-offline";
    }
  }

  window.onload = () => {
    initChart();
    fetchBotData();
    setInterval(fetchBotData, 3000);
  };
</script>
</body>
</html>
