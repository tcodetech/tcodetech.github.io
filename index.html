<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCodeTech | Live Bot Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<header>
  <h1>⚡ Algorithmic Trading Operations</h1>
  <p id="connection-status">🟡 Reading telemetry stream...</p>
</header>

<main>
  <div class="card bot-card">
    <div class="card-header">
      <h2>🤖 4hourbotV6U</h2>
      <span id="v6-badge" class="badge">Checking...</span>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <span class="label">Balance</span>
        <span class="val" id="v6-balance">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">Open PnL</span>
        <span class="val" id="v6-open-pnl">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">Realized PnL</span>
        <span class="val" id="v6-realized-pnl">$0.00</span>
      </div>
      <div class="stat-box">
        <span class="label">Win Rate</span>
        <span class="val" id="v6-winrate">0.0%</span>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="v6Chart"></canvas>
    </div>

    <h3 style="margin-top: 15px;">Active Positions</h3>
    <div id="v6-trades" class="trade-list">
      <p style="color: #bbb;">No active positions.</p>
    </div>
  </div>
</main>

<footer>
  <p>© 2026 TCodeTech • Build: Verified-Syntax-Final4</p>
</footer>

<script>
  let chartInstance = null;

  function initChart() {
    try {
      const canvas = document.getElementById("v6Chart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: Array(20).fill(""),
          datasets: [{
            label: "PnL ($)",
            data: Array(20).fill(0),
            borderColor: "#38ef7d",
            backgroundColor: "rgba(56, 239, 125, 0.1)",
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { display: false },
            y: { grid: { color: "rgba(255,255,255,0.1)" }, ticks: { color: "#ccc" } }
          }
        }
      });
    } catch(e) {
      console.error("Chart initialization error:", e);
    }
  }

  function applyData(data) {
    if (!data || !data.v6) {
      throw new Error("Payload missing root v6 object");
    }
    const v6 = data.v6;

    const statusEl = document.getElementById("connection-status");
    const v6Badge = document.getElementById("v6-badge");

    statusEl.textContent = "🟢 Telemetry Active";
    statusEl.style.color = "#38ef7d";

    if (v6.is_running === true) {
      v6Badge.textContent = "RUNNING";
      v6Badge.className = "badge badge-green";
    } else {
      v6Badge.textContent = "OFFLINE";
      v6Badge.className = "badge badge-red";
    }

    if (v6.balance !== undefined) {
      document.getElementById("v6-balance").textContent = "$" + Number(v6.balance).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    if (v6.open_pnl !== undefined) {
      const openPnlEl = document.getElementById("v6-open-pnl");
      openPnlEl.textContent = (v6.open_pnl >= 0 ? "+" : "") + "$" + Number(v6.open_pnl).toFixed(2);
      openPnlEl.style.color = v6.open_pnl >= 0 ? "#38ef7d" : "#ff4e50";
    }

    if (v6.stats) {
      document.getElementById("v6-realized-pnl").textContent = "$" + Number(v6.stats.realized_pnl || 0).toFixed(2);
      document.getElementById("v6-winrate").textContent = (v6.stats.win_rate || 0) + "% (" + (v6.stats.wins || 0) + "W / " + (v6.stats.losses || 0) + "L)";
    }

    if (v6.pnl_history && Array.isArray(v6.pnl_history) && chartInstance) {
      chartInstance.data.datasets[0].data = v6.pnl_history;
      chartInstance.data.datasets[0].borderColor = (v6.open_pnl >= 0) ? "#38ef7d" : "#ff4e50";
      chartInstance.update();
    }

    const tradesContainer = document.getElementById("v6-trades");
    if (v6.trades && Array.isArray(v6.trades) && v6.trades.length > 0) {
      tradesContainer.innerHTML = "";
      v6.trades.forEach(t => {
        const row = document.createElement("div");
        row.className = "trade-row";

        const info = document.createElement("div");
        const strong = document.createElement("strong");
        strong.textContent = t.symbol;
        const state = document.createElement("small");
        state.textContent = " (" + (t.state || "ACTIVE") + ")";
        const br = document.createElement("br");
        const details = document.createElement("small");
        details.style.color = "#bbb";
        details.textContent = "TP: " + t.tp_pct + "% | SL: " + t.sl_pct + "%";

        info.appendChild(strong);
        info.appendChild(state);
        info.appendChild(br);
        info.appendChild(details);

        const pnl = document.createElement("div");
        pnl.style.fontWeight = "bold";
        pnl.style.color = (t.pnl >= 0) ? "#38ef7d" : "#ff4e50";
        pnl.textContent = (t.pnl >= 0 ? "+" : "") + "$" + Number(t.pnl).toFixed(2);

        row.appendChild(info);
        row.appendChild(pnl);
        tradesContainer.appendChild(row);
      });
    } else {
      tradesContainer.textContent = "Scanning entries (No active positions)...";
    }
  }

  async function fetchBotData() {
    const statusEl = document.getElementById("connection-status");
    const badge = document.getElementById("v6-badge");

    try {
      const url = "./bot_data.json?live=" + Date.now();
      const res = await fetch(url, {
        method: "GET",
        cache: "no-store",
        headers: { "Accept": "application/json" }
      });

      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const data = JSON.parse(text);
      applyData(data);
    } catch (err) {
      console.error("BOT DATA ERROR:", err);
      statusEl.textContent = "🔴 Error: " + err.message;
      statusEl.style.color = "#ff4e50";
      badge.textContent = "ERROR";
      badge.className = "badge badge-red";
    }
  }

  window.onload = () => {
    initChart();
    fetchBotData();
    setInterval(fetchBotData, 3000);
  };
</script>
</body>
</html>
